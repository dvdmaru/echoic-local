<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Noto Sans TC",sans-serif;background:#fbf7f0;position:relative;color:#1d2321}
.glow{position:absolute;right:-120px;top:-160px;width:720px;height:520px;background:radial-gradient(closest-side,#fde9c4,transparent)}
.logo{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:16px;font-size:34px;font-weight:900}
.logo b{color:#0f5c57}
.mark{display:inline-flex;align-items:center;gap:5px;background:#0f5c57;border-radius:14px;padding:0 12px;height:56px}
.mark i{display:block;width:7px;background:#ffd166;border-radius:4px}
.mark i:nth-child(1){height:16px}.mark i:nth-child(2){height:30px}.mark i:nth-child(3){height:40px}.mark i:nth-child(4){height:22px}
h1{position:absolute;left:72px;top:170px;margin:0;font-size:76px;line-height:1.22;font-weight:900}
.hl{background:linear-gradient(transparent 62%,#ffd166 62%);padding:0 6px}
.sub{position:absolute;left:76px;top:420px;font-size:30px;color:#5b6461;font-weight:500}
.chips{position:absolute;left:72px;bottom:64px;display:flex;gap:14px}
.chips span{background:#0f5c57;color:#fff;font-size:24px;font-weight:900;padding:8px 20px;border-radius:999px}
.chips span.c{background:#ff7a59}
.wave{position:absolute;right:90px;top:300px;display:flex;align-items:center;gap:14px}
h1{font-size:68px!important}
.wave i{display:block;width:22px;border-radius:11px;background:#0f5c57}
</style></head><body>
<div class="glow"></div>
<div class="logo"><span class="mark"><i></i><i></i><i></i><i></i></span><span>Echoic <b>本機版</b></span></div>
<h1>會議錄音，在自己的 Mac 上<br><span class="hl">變成逐字稿</span></h1>
<p class="sub">分好誰在說話・每段有時間戳・錄音不上傳</p>
<div class="chips"><span>免費開源</span><span>台灣正體</span><span class="c">摘要選用 Claude</span></div>
<div class="wave"><i style="height:60px"></i><i style="height:120px;background:#ffd166"></i><i style="height:190px"></i><i style="height:140px;background:#ff7a59"></i><i style="height:80px"></i></div>
</body></html>
