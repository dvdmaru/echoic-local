[project]
name = "meeting-local"
version = "0.3.0"
description = "Echoic 本機版：會議錄音在自己電腦轉逐字稿（whisper.cpp＋sherpa-onnx 說話人分離＋台灣正體），摘要選用自己的 Claude"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "sherpa-onnx>=1.12",
  "numpy>=1.26",
  "soundfile>=0.12",
  "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
package = ["pyinstaller>=6.11"]

[project.scripts]
meeting-local = "meeting_local.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meeting_local*"]

[tool.setuptools.package-data]
meeting_local = ["models-catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
